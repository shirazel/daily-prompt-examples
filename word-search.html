<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>תפזורת חנוכה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Varela+Round&display=swap">
<style>
/* Layout: לוח אותיות גדול כמו דף עבודה, ולצידו כרטיס "מילים למציאה" עם שעון; עורך המילים למטה */
:root{
  --bg:#f3f5fb; --paper:#ffffff; --ink:#1d2340; --muted:#5d6482;
  --teal:#5b5bd6; --teal-soft:#eceefb; --blue:#4646c4; --marker:rgba(255,196,0,.45); --cta:#5b5bd6; --cta-hover:#4646c4; --cta-ink:#ffffff;
  --line:#dde1ef; --found-text:#9aa0b8; --gold:#f5a524;
  --hl1:rgba(91,91,214,.32); --hl2:rgba(255,99,132,.32); --hl3:rgba(16,185,129,.32); --hl4:rgba(245,165,36,.4); --hl5:rgba(14,165,233,.32);
  --sel:rgba(255,196,0,.55);
  --display:"Varela Round","Heebo","Segoe UI",Arial,sans-serif;
  --body:"Heebo","Segoe UI",Arial,sans-serif;
  --mono:"Varela Round","Heebo","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121528; --paper:#1b1f38; --ink:#eef0fb; --muted:#a7add0;
  --teal:#8b8bf0; --teal-soft:#23284a; --blue:#a5a5f5; --marker:rgba(255,196,0,.35); --cta:#8b8bf0; --cta-hover:#a5a5f5; --cta-ink:#121528;
  --line:#2c3256; --found-text:#6e7499; --gold:#f5b94a;
  --hl1:rgba(139,139,240,.4); --hl2:rgba(255,120,150,.38); --hl3:rgba(52,211,153,.36); --hl4:rgba(245,185,74,.4); --hl5:rgba(56,189,248,.36);
  --sel:rgba(255,196,0,.42); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121528; --paper:#1b1f38; --ink:#eef0fb; --muted:#a7add0;
  --teal:#8b8bf0; --teal-soft:#23284a; --blue:#a5a5f5; --marker:rgba(255,196,0,.35); --cta:#8b8bf0; --cta-hover:#a5a5f5; --cta-ink:#121528;
  --line:#2c3256; --found-text:#6e7499; --gold:#f5b94a;
  --hl1:rgba(139,139,240,.4); --hl2:rgba(255,120,150,.38); --hl3:rgba(52,211,153,.36); --hl4:rgba(245,185,74,.4); --hl5:rgba(56,189,248,.36);
  --sel:rgba(255,196,0,.42); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.1;margin:0;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 4px}
.sub{margin:4px 0 0;color:var(--muted)}

.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:1fr}}

.board-card{background:var(--teal);border-radius:18px;padding:clamp(10px,2.4vw,20px)}
.board{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;background:var(--paper);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);direction:rtl;z-index:2}
.cell{display:grid;place-items:center;font-family:var(--body);font-weight:700;font-size:clamp(17px,4.2vw,30px);color:var(--ink);cursor:pointer}
.cell:focus-visible{outline:3px solid var(--blue);outline-offset:-3px;border-radius:8px}
svg.marks{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg.marks line{stroke-linecap:round}

.side{display:grid;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 8px;color:var(--blue)}
.words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.words li{font-size:19px;font-weight:600;position:relative;width:max-content;max-width:100%;transition:color .3s}
.words li.found{color:var(--found-text)}
.words li.found::after{content:"";position:absolute;inset-inline:-2px;top:52%;height:2px;background:currentColor}
.progress{margin:10px 0 0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.clock{display:flex;align-items:center;justify-content:space-between;gap:10px}
.time{font-family:var(--mono);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.time.hidden-time{color:transparent;text-shadow:0 0 14px var(--muted)}
.ghost{font:inherit;font-size:15px;font-weight:600;color:var(--blue);background:transparent;border:1.5px solid var(--blue);border-radius:999px;padding:5px 14px;cursor:pointer}
.ghost:focus-visible,.cta:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

.editor{background:var(--teal-soft);border-radius:18px;padding:18px;display:grid;gap:12px}
.editor h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0}
.editor p{margin:0;color:var(--muted);font-size:15px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:12px;align-items:end}
@media (max-width:820px){.fields{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-weight:700;font-size:15px}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
textarea{min-height:46px;height:46px;resize:vertical}
.cta{font:inherit;font-weight:700;font-size:17px;color:var(--cta-ink);background:var(--cta);border:0;border-radius:999px;padding:11px 22px;cursor:pointer;white-space:nowrap}
.cta:hover{background:var(--cta-hover)}
.msg{min-height:1.4em;font-size:15px;color:var(--blue);font-weight:600}

.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,25,40,.45);z-index:20;padding:16px}
.win-card{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 30px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.win-card h2{font-family:var(--display);font-weight:900;font-size:32px;margin:0}
.stars{font-size:40px;letter-spacing:6px;margin:6px 0;color:var(--gold)}
.stars .off{color:var(--line);-webkit-text-stroke:0}
.win-card p{margin:4px 0 16px;font-variant-numeric:tabular-nums}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:480px){@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>תפזורת <mark id="topicTitle">חנוכה</mark></h1>
      <p class="sub">גררו עם העכבר או עם האצבע על האותיות כדי לסמן מילה. המילים מסתתרות לאורך, לרוחב ובאלכסון.</p>
    </div>
  </header>

  <section class="game">
    <div class="board-card">
      <div class="board" id="board">
        <svg class="marks" id="marks" aria-hidden="true"></svg>
        <div class="grid" id="grid" role="grid" aria-label="לוח התפזורת"></div>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <h2>מילים למציאה</h2>
        <ul class="words" id="words"></ul>
        <p class="progress" id="progress"></p>
      </div>
      <div class="panel clock">
        <div>
          <div style="font-size:14px;color:var(--muted);font-weight:600">זמן</div>
          <div class="time" id="time">00:00</div>
        </div>
        <button class="ghost" id="toggleTime" type="button">הסתרת השעון</button>
      </div>
      <button class="ghost" id="restart" type="button" style="justify-self:start">ערבוב מחדש</button>
    </aside>
  </section>

  <section class="editor" aria-labelledby="edTitle">
    <h2 id="edTitle">תפזורת משלכם</h2>
    <p>כתבו נושא ורשימת מילים (מופרדות בפסיק או בשורה חדשה). עד 12 מילים, עד 10 אותיות כל אחת.</p>
    <form class="fields" id="editForm">
      <label for="topicIn">נושא
        <input id="topicIn" type="text" value="חנוכה" maxlength="30">
      </label>
      <label for="wordsIn">מילים
        <textarea id="wordsIn">סביבון, חנוכייה, סופגנייה, לביבה, מכבים, שמן, נרות, אור</textarea>
      </label>
      <button class="cta" type="submit">צור תפזורת חדשה</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </section>
</div>

<div class="win" id="win" hidden>
  <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <h2 id="winTitle">מצאתם הכול!</h2>
    <div class="stars" id="stars"></div>
    <p id="winText"></p>
    <button class="cta" id="again" type="button">משחק חדש</button>
  </div>
</div>

<script>
(() => {
  const N = 10;
  const LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]]; // לרוחב (מימין לשמאל), למטה, ושני האלכסונים
  const HL = ['--hl1','--hl2','--hl3','--hl4','--hl5'];

  const gridEl = document.getElementById('grid');
  const svg = document.getElementById('marks');
  const wordsEl = document.getElementById('words');
  const progressEl = document.getElementById('progress');
  const timeEl = document.getElementById('time');
  const msgEl = document.getElementById('msg');

  let letters = [], placed = [], found = new Set(), foundLines = [];
  let start = null, current = null, dragging = false;
  let t0 = 0, timer = null, elapsed = 0, finished = false;
  let audio = null;

  // ---------- יצירת לוח ----------
  function clean(w){ return w.replace(/[֑-ׇ]/g,'').replace(/[^א-ת]/g,''); }

  function build(words){
    for (let attempt = 0; attempt < 60; attempt++){
      const g = Array.from({length:N}, () => Array(N).fill(''));
      const out = [];
      const order = [...words].sort((a,b) => b.length - a.length);
      let ok = true;
      for (const w of order){
        let done = false;
        for (let tries = 0; tries < 300 && !done; tries++){
          const [dr,dc] = DIRS[Math.floor(Math.random()*DIRS.length)];
          const r = Math.floor(Math.random()*N), c = Math.floor(Math.random()*N);
          const er = r + dr*(w.length-1), ec = c + dc*(w.length-1);
          if (er<0||er>=N||ec<0||ec>=N) continue;
          let fits = true;
          for (let i=0;i<w.length;i++){ const ch = g[r+dr*i][c+dc*i]; if (ch && ch!==w[i]) { fits=false; break; } }
          if (!fits) continue;
          for (let i=0;i<w.length;i++) g[r+dr*i][c+dc*i] = w[i];
          out.push({word:w, r, c, er, ec}); done = true;
        }
        if (!done){ ok = false; break; }
      }
      if (ok){
        for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!g[r][c]) g[r][c] = LETTERS[Math.floor(Math.random()*LETTERS.length)];
        return {g, out};
      }
    }
    return null;
  }

  function newGame(words, topic){
    const res = build(words);
    if (!res){ msgEl.textContent = 'המילים לא נכנסו ללוח. נסו פחות מילים או מילים קצרות יותר.'; return false; }
    letters = res.g; placed = res.out; found = new Set(); foundLines = [];
    document.getElementById('topicTitle').textContent = topic || 'מילים';
    renderGrid(); renderWords(); drawLines();
    clearInterval(timer); elapsed = 0; t0 = 0; finished = false; timeEl.textContent = '00:00';
    document.getElementById('win').hidden = true;
    return true;
  }

  function renderGrid(){
    gridEl.innerHTML = '';
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const d = document.createElement('div');
      d.className = 'cell'; d.textContent = letters[r][c];
      d.dataset.r = r; d.dataset.c = c; d.setAttribute('role','gridcell');
      gridEl.appendChild(d);
    }
  }

  function renderWords(){
    wordsEl.innerHTML = '';
    placed.map(p => p.word).sort().forEach(w => {
      const li = document.createElement('li'); li.textContent = w; li.dataset.w = w;
      if (found.has(w)) li.classList.add('found');
      wordsEl.appendChild(li);
    });
    progressEl.textContent = 'נמצאו ' + found.size + ' מתוך ' + placed.length;
  }

  // ---------- ציור קווי הדגשה ----------
  function center(r,c){
    const cell = gridEl.children[r*N+c];
    const b = svg.getBoundingClientRect(), x = cell.getBoundingClientRect();
    return [x.left - b.left + x.width/2, x.top - b.top + x.height/2, x.width];
  }
  function lineEl(a, b, color){
    const [x1,y1,w] = center(a[0],a[1]), [x2,y2] = center(b[0],b[1]);
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke', color); l.setAttribute('stroke-width', w*0.78);
    return l;
  }
  function drawLines(){
    svg.innerHTML = '';
    const cs = getComputedStyle(document.documentElement);
    foundLines.forEach((f,i) => svg.appendChild(lineEl(f.a, f.b, cs.getPropertyValue(HL[i % HL.length]).trim())));
    if (dragging && start && current) svg.appendChild(lineEl(start, current, cs.getPropertyValue('--sel').trim()));
  }

  // ---------- גרירה ----------
  function cellAt(x,y){
    const el = document.elementFromPoint(x,y);
    return el && el.classList && el.classList.contains('cell') ? [+el.dataset.r, +el.dataset.c] : null;
  }
  // מצמיד את סוף הגרירה לקו ישר: שורה, עמודה או אלכסון
  function snap(a, b){
    let dr = b[0]-a[0], dc = b[1]-a[1];
    const ar = Math.abs(dr), ac = Math.abs(dc);
    if (ar === 0 || ac === 0) return b;
    if (ar > ac*2) return [b[0], a[1]];
    if (ac > ar*2) return [a[0], b[1]];
    const k = Math.min(ar, ac);
    return [a[0] + Math.sign(dr)*k, a[1] + Math.sign(dc)*k];
  }
  function lettersBetween(a, b){
    const dr = Math.sign(b[0]-a[0]), dc = Math.sign(b[1]-a[1]);
    const len = Math.max(Math.abs(b[0]-a[0]), Math.abs(b[1]-a[1])) + 1;
    let s = '';
    for (let i=0;i<len;i++) s += letters[a[0]+dr*i][a[1]+dc*i];
    return s;
  }

  const board = document.getElementById('board');
  board.addEventListener('pointerdown', e => {
    const p = cellAt(e.clientX, e.clientY); if (!p || finished) return;
    if (!audio){ try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
    if (!t0){ t0 = Date.now(); timer = setInterval(tick, 250); }
    start = p; current = p; dragging = true;
    board.setPointerCapture(e.pointerId); drawLines(); e.preventDefault();
  });
  board.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = cellAt(e.clientX, e.clientY); if (!p) return;
    const s = snap(start, p);
    if (!current || s[0]!==current[0] || s[1]!==current[1]){ current = s; drawLines(); }
  });
  const end = () => {
    if (!dragging) return; dragging = false;
    const s = lettersBetween(start, current), rev = [...s].reverse().join('');
    const hit = placed.find(p => !found.has(p.word) && (p.word === s || p.word === rev) && s.length > 1);
    if (hit){
      found.add(hit.word); foundLines.push({a:start, b:current});
      renderWords(); chime(false);
      if (found.size === placed.length) win();
    }
    start = current = null; drawLines();
  };
  board.addEventListener('pointerup', end);
  board.addEventListener('pointercancel', end);
  window.addEventListener('resize', drawLines);

  // ---------- זמן וסיום ----------
  function fmt(ms){ const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  function tick(){ elapsed = Date.now() - t0; timeEl.textContent = fmt(elapsed); }

  function win(){
    finished = true; tick(); clearInterval(timer);
    const perWord = elapsed / 1000 / placed.length;
    const stars = perWord <= 12 ? 3 : perWord <= 25 ? 2 : 1;
    document.getElementById('stars').innerHTML = [1,2,3].map(i => '<span class="' + (i <= stars ? '' : 'off') + '">★</span>').join('');
    document.getElementById('winText').textContent = 'כל ' + placed.length + ' המילים נמצאו בזמן ' + fmt(elapsed);
    setTimeout(() => { document.getElementById('win').hidden = false; document.getElementById('again').focus(); }, 350);
    chime(true); confetti();
  }

  // ---------- צלילים ----------
  function chime(big){
    if (!audio) return;
    const notes = big ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77];
    notes.forEach((f,i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i*0.11;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t+0.02); g.gain.exponentialRampToValueAtTime(0.001, t+0.45);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t+0.5);
    });
  }

  // ---------- קונפטי ----------
  function confetti(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
    const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
    cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = ['--teal','--gold','--hl3','--hl4'].map(v => cs.getPropertyValue(v).trim());
    const ps = Array.from({length:160}, () => ({ x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5,
      vx:(Math.random()-.5)*3, vy:2+Math.random()*3, s:6+Math.random()*6, a:Math.random()*6, va:(Math.random()-.5)*.3,
      c:cols[Math.floor(Math.random()*cols.length)] }));
    const t1 = performance.now();
    (function frame(now){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.a += p.va;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
      if (now - t1 < 3800) requestAnimationFrame(frame); else cv.remove();
    })(t1);
  }

  // ---------- כפתורים ועורך ----------
  let timeHidden = false;
  document.getElementById('toggleTime').addEventListener('click', e => {
    timeHidden = !timeHidden; timeEl.classList.toggle('hidden-time', timeHidden);
    e.currentTarget.textContent = timeHidden ? 'הצגת השעון' : 'הסתרת השעון';
  });

  function readEditor(){
    const topic = document.getElementById('topicIn').value.trim();
    const raw = document.getElementById('wordsIn').value.split(/[,\n،]+/).map(clean).filter(Boolean);
    const uniq = [...new Set(raw)];
    const tooLong = uniq.filter(w => w.length > N);
    const words = uniq.filter(w => w.length >= 2 && w.length <= N).slice(0, 12);
    return {topic, words, tooLong, cut: uniq.filter(w => w.length >= 2 && w.length <= N).length > 12};
  }
  function startFromEditor(){
    const {topic, words, tooLong, cut} = readEditor();
    if (words.length < 2){ msgEl.textContent = 'צריך לפחות שתי מילים בעברית.'; return; }
    if (newGame(words, topic)){
      const notes = [];
      if (tooLong.length) notes.push('לא נכנסו כי הן ארוכות מ־10 אותיות: ' + tooLong.join(', '));
      if (cut) notes.push('נכנסו 12 המילים הראשונות.');
      msgEl.textContent = notes.length ? notes.join(' ') : 'התפזורת החדשה מוכנה.';
    }
  }
  document.getElementById('editForm').addEventListener('submit', e => { e.preventDefault(); startFromEditor(); });
  document.getElementById('restart').addEventListener('click', () => { msgEl.textContent = ''; startFromEditor(); });
  document.getElementById('again').addEventListener('click', () => { msgEl.textContent = ''; startFromEditor(); });

  startFromEditor(); msgEl.textContent = '';
})();
</script>

</html>
