<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תפזורת מילים אינטראקטיבית</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Varela+Round&display=swap">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: "Heebo", sans-serif; background: #f5f6fa; color: #222; }
  h1, h2 { font-family: "Varela Round", "Heebo", sans-serif; font-weight: 400; }
  .app { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { text-align: center; margin: 0 0 20px; font-size: 32px; }
  .layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  /* 1. לוח התפזורת */
  .board { position: relative; width: min(100%, 480px); aspect-ratio: 1; background: #fff; border: 2px solid #ccd; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); z-index: 2; }
  .cell { display: flex; align-items: center; justify-content: center; font-family: "Varela Round", sans-serif; font-size: clamp(16px, 4.5vw, 26px); cursor: pointer; }
  svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  svg.lines line { stroke-linecap: round; }

  /* 2. רשימת המילים */
  .side { flex: 1 1 220px; max-width: 320px; display: flex; flex-direction: column; gap: 16px; }
  .box { background: #fff; border: 1px solid #dde; border-radius: 12px; padding: 16px; }
  .box h2 { margin: 0 0 10px; font-size: 20px; }
  .words { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .words li { font-size: 18px; }
  .words li.found { text-decoration: line-through; color: #999; }

  /* 3. טיימר */
  .timer { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-variant-numeric: tabular-nums; }
  .timer.hidden-time span { visibility: hidden; }
  button { font-family: inherit; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid #889; background: #fff; cursor: pointer; }
  button.primary { background: #4a5bd4; color: #fff; border-color: #4a5bd4; }

  /* פאנל עריכה */
  textarea, input { width: 100%; font-family: inherit; font-size: 16px; padding: 8px; border: 1px solid #ccd; border-radius: 8px; }
  textarea { min-height: 90px; resize: vertical; }
  label { display: block; font-size: 14px; margin: 8px 0 4px; }
  .msg { font-size: 14px; color: #a33; min-height: 1.2em; margin-top: 6px; }

  /* מסך סיום */
  .finish { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .finish-card { background: #fff; border-radius: 16px; padding: 28px; text-align: center; max-width: 340px; width: 100%; }
  .finish-card h2 { margin: 0 0 8px; font-size: 28px; }
  .stars { font-size: 38px; color: #f5b301; letter-spacing: 4px; }
  .stars .off { color: #ddd; }
  canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<div class="app">
  <h1>תפזורת מילים: <span id="topicTitle"></span></h1>

  <div class="layout">
    <div class="board" id="board">
      <svg class="lines" id="lines"></svg>
      <div class="grid" id="grid"></div>
    </div>

    <div class="side">
      <div class="box">
        <h2>מילים למציאה</h2>
        <ul class="words" id="words"></ul>
      </div>

      <div class="box">
        <div class="timer" id="timer"><span id="time">00:00</span><button id="toggleTime" type="button">הסתר טיימר</button></div>
      </div>

      <div class="box">
        <h2>עריכת מילים</h2>
        <label for="topicIn">נושא</label>
        <input id="topicIn" type="text" value="חנוכה">
        <label for="wordsIn">מילים (מילה בכל שורה)</label>
        <textarea id="wordsIn">סביבון
חנוכייה
סופגנייה
לביבה
מכבים
שמן
נרות
נס</textarea>
        <button class="primary" id="create" type="button" style="margin-top:10px;width:100%">צור תפזורת חדשה</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>
</div>

<div class="finish" id="finish" hidden>
  <div class="finish-card">
    <h2>כל הכבוד!</h2>
    <div class="stars" id="stars"></div>
    <p id="finishText"></p>
    <button class="primary" id="again" type="button">משחק חדש</button>
  </div>
</div>

<script>
(function () {
  var N = 10;
  var LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
  var DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  var COLORS = ['rgba(255,99,132,.4)','rgba(54,162,235,.4)','rgba(255,206,86,.55)','rgba(75,192,192,.45)','rgba(153,102,255,.4)','rgba(255,159,64,.45)'];

  var gridEl = document.getElementById('grid'), svg = document.getElementById('lines');
  var letters = [], placed = [], found = {}, foundLines = [];
  var start = null, current = null, dragging = false;
  var t0 = 0, timer = null, elapsed = 0, finished = false, audio = null;

  function clean(w) { return w.replace(/[֑-ׇ]/g, '').replace(/[^א-ת]/g, ''); }

  function build(words) {
    for (var attempt = 0; attempt < 80; attempt++) {
      var g = [], out = [], ok = true;
      for (var i = 0; i < N; i++) { g.push([]); for (var j = 0; j < N; j++) g[i].push(''); }
      var order = words.slice().sort(function (a, b) { return b.length - a.length; });
      for (var w = 0; w < order.length && ok; w++) {
        var word = order[w], done = false;
        for (var t = 0; t < 300 && !done; t++) {
          var d = DIRS[Math.floor(Math.random() * DIRS.length)];
          var r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N);
          var er = r + d[0] * (word.length - 1), ec = c + d[1] * (word.length - 1);
          if (er < 0 || er >= N || ec < 0 || ec >= N) continue;
          var fits = true;
          for (var k = 0; k < word.length; k++) { var ch = g[r + d[0]*k][c + d[1]*k]; if (ch && ch !== word[k]) { fits = false; break; } }
          if (!fits) continue;
          for (k = 0; k < word.length; k++) g[r + d[0]*k][c + d[1]*k] = word[k];
          out.push({ word: word }); done = true;
        }
        if (!done) ok = false;
      }
      if (ok) {
        for (i = 0; i < N; i++) for (j = 0; j < N; j++) if (!g[i][j]) g[i][j] = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        return { g: g, out: out };
      }
    }
    return null;
  }

  function newGame() {
    var topic = document.getElementById('topicIn').value.trim();
    var raw = document.getElementById('wordsIn').value.split(/[\n,]+/).map(clean).filter(function (w) { return w.length >= 2 && w.length <= N; });
    var words = raw.filter(function (w, i) { return raw.indexOf(w) === i; }).slice(0, 12);
    var msg = document.getElementById('msg');
    if (words.length < 2) { msg.textContent = 'צריך לפחות שתי מילים (עד 10 אותיות כל אחת).'; return; }
    var res = build(words);
    if (!res) { msg.textContent = 'המילים לא נכנסו ללוח. נסו פחות מילים או מילים קצרות יותר.'; return; }
    msg.textContent = '';
    letters = res.g; placed = res.out; found = {}; foundLines = [];
    document.getElementById('topicTitle').textContent = topic;
    gridEl.innerHTML = '';
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var d = document.createElement('div'); d.className = 'cell'; d.textContent = letters[r][c];
      d.dataset.r = r; d.dataset.c = c; gridEl.appendChild(d);
    }
    renderWords(); draw();
    clearInterval(timer); t0 = 0; elapsed = 0; finished = false;
    document.getElementById('time').textContent = '00:00';
    document.getElementById('finish').hidden = true;
  }

  function renderWords() {
    var ul = document.getElementById('words'); ul.innerHTML = '';
    placed.forEach(function (p) { var li = document.createElement('li'); li.textContent = p.word; if (found[p.word]) li.className = 'found'; ul.appendChild(li); });
  }

  function center(r, c) {
    var cell = gridEl.children[r * N + c], b = svg.getBoundingClientRect(), x = cell.getBoundingClientRect();
    return [x.left - b.left + x.width / 2, x.top - b.top + x.height / 2, x.width];
  }
  function line(a, b, color) {
    var p = center(a[0], a[1]), q = center(b[0], b[1]);
    var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', p[0]); l.setAttribute('y1', p[1]); l.setAttribute('x2', q[0]); l.setAttribute('y2', q[1]);
    l.setAttribute('stroke', color); l.setAttribute('stroke-width', p[2] * 0.75);
    return l;
  }
  function draw() {
    svg.innerHTML = '';
    foundLines.forEach(function (f, i) { svg.appendChild(line(f.a, f.b, COLORS[i % COLORS.length])); });
    if (dragging && start && current) svg.appendChild(line(start, current, 'rgba(120,120,140,.35)'));
  }

  function cellAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el && el.classList && el.classList.contains('cell') ? [+el.dataset.r, +el.dataset.c] : null;
  }
  function snap(a, b) {
    var dr = b[0] - a[0], dc = b[1] - a[1], ar = Math.abs(dr), ac = Math.abs(dc);
    if (!ar || !ac) return b;
    if (ar > ac * 2) return [b[0], a[1]];
    if (ac > ar * 2) return [a[0], b[1]];
    var k = Math.min(ar, ac);
    return [a[0] + Math.sign(dr) * k, a[1] + Math.sign(dc) * k];
  }
  function between(a, b) {
    var dr = Math.sign(b[0] - a[0]), dc = Math.sign(b[1] - a[1]);
    var len = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) + 1, s = '';
    for (var i = 0; i < len; i++) s += letters[a[0] + dr * i][a[1] + dc * i];
    return s;
  }

  var board = document.getElementById('board');
  board.addEventListener('pointerdown', function (e) {
    var p = cellAt(e.clientX, e.clientY); if (!p || finished) return;
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
    if (!t0) { t0 = Date.now(); timer = setInterval(tick, 500); }
    start = current = p; dragging = true;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    draw(); e.preventDefault();
  });
  board.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = cellAt(e.clientX, e.clientY); if (!p) return;
    var s = snap(start, p);
    if (s[0] !== current[0] || s[1] !== current[1]) { current = s; draw(); }
  });
  function end() {
    if (!dragging) return; dragging = false;
    var s = between(start, current), rev = s.split('').reverse().join('');
    var hit = placed.filter(function (p) { return !found[p.word] && (p.word === s || p.word === rev); })[0];
    if (hit) {
      found[hit.word] = true; foundLines.push({ a: start, b: current });
      renderWords(); sound([660, 880]);
      if (Object.keys(found).length === placed.length) win();
    }
    start = current = null; draw();
  }
  board.addEventListener('pointerup', end);
  board.addEventListener('pointercancel', end);
  window.addEventListener('resize', draw);

  function fmt(ms) { var s = Math.floor(ms / 1000); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); }
  function tick() { elapsed = Date.now() - t0; document.getElementById('time').textContent = fmt(elapsed); }

  function sound(notes) {
    if (!audio) return;
    notes.forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.12;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.45);
    });
  }

  function win() {
    finished = true; tick(); clearInterval(timer);
    var perWord = elapsed / 1000 / placed.length, stars = perWord <= 12 ? 3 : perWord <= 25 ? 2 : 1, html = '';
    for (var i = 1; i <= 3; i++) html += '<span class="' + (i <= stars ? '' : 'off') + '">★</span>';
    document.getElementById('stars').innerHTML = html;
    document.getElementById('finishText').textContent = 'מצאתם את כל המילים בזמן ' + fmt(elapsed);
    document.getElementById('finish').hidden = false;
    sound([523, 659, 784, 1047]); confetti();
  }

  function confetti() {
    var cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
    var ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
    var cols = ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40'], ps = [];
    for (var i = 0; i < 150; i++) ps.push({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight / 2, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, s: 6 + Math.random() * 6, a: Math.random() * 6, c: cols[i % cols.length] });
    var t1 = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += .04; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (now - t1 < 3500) requestAnimationFrame(frame); else cv.remove();
    })(t1);
  }

  document.getElementById('toggleTime').addEventListener('click', function () {
    var t = document.getElementById('timer'); t.classList.toggle('hidden-time');
    this.textContent = t.classList.contains('hidden-time') ? 'הצג טיימר' : 'הסתר טיימר';
  });
  document.getElementById('create').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
