<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דוגמאות מהפרומפט היומי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Varela+Round&display=swap">
<style>
:root{--bg:#ece3cd;--paper:#f6efdd;--ink:#241f3a;--ink-soft:#56507a;--rule:rgba(36,31,58,.16);--teal:#1f6f68;--red:#c73f1d;--shadow-soft:rgba(36,26,12,.1);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17132a;--paper:#211c3a;--ink:#f2ecdd;--ink-soft:#c6bfe0;--rule:rgba(242,236,221,.14);--teal:#5fc9c1;--red:#ff7a52;--shadow-soft:rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17132a;--paper:#211c3a;--ink:#f2ecdd;--ink-soft:#c6bfe0;--rule:rgba(242,236,221,.14);--teal:#5fc9c1;--red:#ff7a52;--shadow-soft:rgba(0,0,0,.3);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:44px 20px}
h1{font-family:"Varela Round","Heebo",sans-serif;font-weight:900;font-size:clamp(2rem,6vw,3rem);margin:0 0 6px;text-wrap:balance}
p{color:var(--ink-soft);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a{display:block;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px 20px;color:var(--ink);text-decoration:none;font-family:"Varela Round","Heebo",sans-serif;font-weight:700;font-size:1.25rem;box-shadow:0 1px 2px var(--shadow-soft)}
a span{display:block;font-family:"Heebo",sans-serif;font-weight:400;color:var(--ink-soft);font-size:15px}
a:hover,a:focus-visible{border-color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>דוגמאות מהפרומפט היומי</h1>
<p>כלים שנבנו ישירות מפרומפטי הקוד של הפרומפט היומי.</p>
<ul>
<li><a href="word-search.html">תפזורת מילים אינטראקטיבית<span>גוררים על האותיות, מוצאים מילים, ויוצרים תפזורת משלכם</span></a></li>
</ul>
</main>
</body>
</html>
